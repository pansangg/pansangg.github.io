<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>перенаправление…</title>
  <script>
        // Функция для проверки страны по IP
        fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            if (data.country === "UA") {
                // Если Украина → редирект на proxied домен
                window.location.href = "https://proxied.pansangg.su";
            } else {
                // Все остальные → основной домен
                window.location.href = "https://pansangg.su";
            }
        })
        .catch(() => {
            // Если ошибка при определении IP — по умолчанию основной домен
            window.location.href = "https://pansangg.su";
        });
  </script>
</head>
<body>
  <h1 style="text-align: center;">сайт переехал. перенаправляю...</h1>
  <p style="text-align: center;">если редирект не произошел - перейдите вручную.</p>
  <p style="text-align: center;">для всех стран - https://pansangg.su<br>для Украины - https://proxied.pansangg.su</p>
</body>
</html>
