<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=https://pansangg.su">
  <title>перенаправление…</title>
  <script>
        // Функция для проверки страны по IP
        fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            if (data.country === "UA") {
                // Если Украина → редирект на proxied домен
                window.location.href = "https://proxied.pansangg.su/api/andesshell/rp.zip";
            } else {
                // Все остальные → основной домен
                window.location.href = "https://pansangg.su/api/andesshell/rp.zip";
            }
        })
        .catch(() => {
            // Если ошибка при определении IP — по умолчанию основной домен
            window.location.href = "https://pansangg.su/api/andesshell/rp.zip";
        });
    </script>
</head>
